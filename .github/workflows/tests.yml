name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Bootstrap Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Resolve default test environment
        id: environment
        run: python scripts/test_environment.py resolve default --output "$RUNNER_TEMP/ha-test-environment.json" --github-output "$GITHUB_OUTPUT"

      - name: Set up target Python
        uses: actions/setup-python@v7
        with:
          python-version: "${{ steps.environment.outputs.python }}"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: scripts/install_test_dependencies.sh --environment "$RUNNER_TEMP/ha-test-environment.json"

      - name: Static validation
        run: PYTHON="$(command -v python)" scripts/verify_local.sh --static

  test:
    name: Test HA ${{ matrix.homeassistant }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        homeassistant: ["2026.8.3", "2026.9.3", latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Bootstrap Python 3.14
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Resolve test environment
        id: environment
        run: >-
          python scripts/test_environment.py resolve
          "${{ matrix.homeassistant }}"
          --output "$RUNNER_TEMP/ha-test-environment.json"
          --github-output "$GITHUB_OUTPUT"

      - name: Set up target Python
        uses: actions/setup-python@v7
        with:
          python-version: "${{ steps.environment.outputs.python }}"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: scripts/install_test_dependencies.sh --environment "$RUNNER_TEMP/ha-test-environment.json"

      - name: Run full pytest suite
        run: |
          mkdir -p test-results
          cp "$RUNNER_TEMP/ha-test-environment.json" test-results/environment.json
          PYTHON="$(command -v python)" scripts/verify_local.sh --pytest

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results-ha-${{ matrix.homeassistant }}
          path: |
            test-results/pytest.xml
            test-results/environment.json
          if-no-files-found: warn

  test-status:
    name: Test
    if: always()
    needs:
      - test
    runs-on: ubuntu-latest
    timeout-minutes: 1

    steps:
      - name: Require every Home Assistant matrix run to pass
        env:
          MATRIX_RESULT: ${{ needs.test.result }}
        run: |
          if [[ "$MATRIX_RESULT" != "success" ]]; then
            echo "Home Assistant test matrix result was: $MATRIX_RESULT" >&2
            exit 1
          fi
