name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements_test.txt

      - name: Static validation
        run: scripts/verify_local.sh --static

  test:
    name: Test HA ${{ matrix.homeassistant }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - homeassistant: "2026.10.0"
            harness-version: "0.13.371"
          - homeassistant: "2026.9.3"
            harness-version: "0.13.366"
          - homeassistant: "2026.8.3"
            harness-version: "0.13.357"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip wheel
          scripts/install_test_dependencies.sh "${{ matrix.homeassistant }}" "${{ matrix.harness-version }}"

      - name: Run full pytest suite
        run: scripts/verify_local.sh --pytest

      - name: Upload pytest results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-results-ha-${{ matrix.homeassistant }}
          path: test-results/pytest.xml
          if-no-files-found: warn

  test-status:
    name: Test
    if: always()
    needs:
      - test
    runs-on: ubuntu-latest
    timeout-minutes: 1

    steps:
      - name: Require every Home Assistant matrix run to pass
        env:
          MATRIX_RESULT: ${{ needs.test.result }}
        run: |
          if [[ "$MATRIX_RESULT" != "success" ]]; then
            echo "Home Assistant test matrix result was: $MATRIX_RESULT" >&2
            exit 1
          fi
