name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to package and publish"
        required: true
        type: string

permissions:
  contents: read

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Hassfest
        uses: home-assistant/actions/hassfest@master

  package:
    needs:
      - hacs
      - hassfest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip wheel
          pip install -r requirements_test.txt

      - name: Validate release candidate
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          REQUIRE_MAIN_ANCESTOR: "1"
        run: scripts/verify_release_candidate.sh

      # Releases are immutable once published, so assets must be attached while
      # the release is still a draft. Create (or reuse) a draft, upload the
      # package, then publish it.
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          is_draft="$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft 2>/dev/null || echo missing)"
          case "$is_draft" in
            missing)
              gh release create "$RELEASE_TAG" dist/mcp_assist.zip \
                --repo "$GITHUB_REPOSITORY" \
                --verify-tag \
                --draft \
                --title "$RELEASE_TAG" \
                --generate-notes
              ;;
            true)
              gh release upload "$RELEASE_TAG" dist/mcp_assist.zip \
                --repo "$GITHUB_REPOSITORY" \
                --clobber
              ;;
            *)
              echo "::error::Release $RELEASE_TAG is already published and immutable, so mcp_assist.zip cannot be attached. Release a new version instead."
              exit 1
              ;;
          esac
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
