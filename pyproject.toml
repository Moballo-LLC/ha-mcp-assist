[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --strict-markers -p no:respx"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["custom_components", "tests"]

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]
